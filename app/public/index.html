<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>놓침제로 · 무료체험·구독·반품 기한 알림</title>
<meta name="description" content="결제 문자를 붙여 넣으면 무료체험·구독·반품·보증 기한을 마감 전에 알려 드려요.">
<meta name="theme-color" content="#f4f5f2">
<meta property="og:type" content="website">
<meta property="og:title" content="놓침제로 · 돈 나가기 전에 알려 주는 기한 알림">
<meta property="og:description" content="결제 문자를 붙여 넣으면 마감 전에 알려 드려요.">
<meta property="og:image" content="https://nochimzero.pages.dev/og.png">
<meta property="og:url" content="https://nochimzero.pages.dev/">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="놓침제로">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <span class="brand"><img src="/icon-192.png" alt="" width="26" height="26">놓침제로<span class="pro-badge" id="pro-badge" hidden>PRO</span></span>
  <button class="icon-btn" id="menu-btn" aria-label="메뉴">⋯</button>
</header>

<main class="wrap">
  <section class="empty" id="hero">
    <h1>결제 문자 복사하고<br>＋ 누르면 끝</h1>
    <p>마감 3일 전, 하루 전에 알려 드려요</p>
  </section>

  <section id="board" hidden>
    <button class="saved-line" id="saved" hidden></button>
    <ul class="list" id="list"></ul>
  </section>
</main>

<div class="fab-bar"><button class="primary fab" id="open-add">＋ 추가</button></div>

<dialog id="add-sheet">
  <form method="dialog" class="sheet">
    <div id="paste-area" class="paste-area">
      <textarea id="text" placeholder="결제 문자 붙여넣기"></textarea>
      <button type="button" class="primary wide" id="read">찾기</button>
      <div class="sub-row">
        <label class="text-btn" for="photo">캡처로 올리기 <span class="pro-badge">PRO</span></label>
        <input id="photo" type="file" accept="image/*" hidden>
        <span class="samples" id="samples"></span>
      </div>
      <p class="note" id="photo-msg" hidden></p>
    </div>

    <div class="confirm" id="confirm" aria-live="polite">
      <p class="found" id="found"></p>
      <p class="calc" id="calc"></p>
      <button type="button" class="primary wide" id="add">추가</button>
      <div class="sub-row">
        <button type="button" class="text-btn" id="cancel">다시</button>
        <details class="edit">
          <summary>날짜 고치기</summary>
          <div class="fields">
            <label for="f-name">이름</label><input id="f-name">
            <label for="f-type">종류</label>
            <select id="f-type">
              <option value="trial">무료체험 종료</option>
              <option value="sub">구독 갱신</option>
              <option value="return">반품 기한</option>
              <option value="warranty">보증기간</option>
            </select>
            <label for="f-base" id="l-base">기준일</label><input id="f-base" type="date">
            <label for="f-n">기간</label>
            <div class="rule"><input id="f-n" type="number" min="1" inputmode="numeric"><select id="f-unit"><option value="d">일</option><option value="m">개월</option><option value="y">년</option></select></div>
          </div>
        </details>
      </div>
    </div>
  </form>
</dialog>

<dialog id="item">
  <form method="dialog" class="sheet">
    <p class="item-head"><span class="dday" id="item-dday"></span><span><b id="item-name"></b><small id="item-meta"></small></span></p>
    <a class="primary wide btnlike" id="item-guide" target="_blank" rel="noopener"></a>
    <button type="button" class="wide" id="item-done"></button>
    <div class="sub-row center">
      <button type="button" class="text-btn" id="item-bell"></button>
      <button type="button" class="text-btn danger" id="item-del">삭제</button>
    </div>
  </form>
</dialog>

<dialog id="menu">
  <form method="dialog" class="sheet menu">
    <a class="menu-row" href="/premium.html?via=menu"><span>프리미엄</span><span class="muted">월 1,900원</span></a>
    <button type="button" class="menu-row" id="family"><span>가족에게 보내기</span><span class="pro-badge">PRO</span></button>
    <button type="button" class="menu-row" id="share"><span>친구에게 알려 주기</span></button>
    <a class="menu-row" id="apk" href="/nochimzero.apk" download hidden><span>안드로이드 앱 받기</span></a>
    <button type="button" class="menu-row" id="install" hidden><span>홈 화면에 추가</span></button>
    <p class="note center">문자는 이 폰에만 저장돼요</p>
  </form>
</dialog>

<dialog id="cal">
  <form method="dialog" class="sheet">
    <p class="found" id="cal-title"></p>
    <p class="muted" id="cal-when"></p>
    <a class="primary wide" id="cal-ics" href="#">아이폰 캘린더</a>
    <a class="wide btnlike" id="cal-google" href="#" target="_blank" rel="noopener">구글 캘린더</a>
  </form>
</dialog>

<dialog id="report">
  <form method="dialog" class="sheet">
    <p class="saved-total"><b id="saved-total"></b><span class="muted" id="saved-count"></span></p>
    <ul class="saved-detail" id="saved-detail"></ul>
    <a class="primary wide btnlike" id="saved-lock" href="/premium.html?via=report" hidden>프리미엄에서 보기</a>
  </form>
</dialog>

<dialog id="limit">
  <form method="dialog" class="sheet">
    <p class="found" id="limit-title"></p>
    <p class="muted" id="limit-body"></p>
    <a class="primary wide btnlike" href="/premium.html?via=limit">프리미엄 보기</a>
  </form>
</dialog>

<dialog id="import">
  <form method="dialog" class="sheet">
    <p class="found" id="import-title"></p>
    <ul class="saved-detail" id="import-list"></ul>
    <button class="primary wide" id="import-ok">내 목록에 추가</button>
  </form>
</dialog>

<dialog id="ios">
  <form method="dialog" class="sheet">
    <p class="found">Safari 공유 → 홈 화면에 추가</p>
    <button class="primary wide" value="close">확인</button>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
